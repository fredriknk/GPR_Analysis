name: Synthetic scientific pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install verified Windows environment
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-full-win-py311.lock
      - name: Install package on Windows
        if: runner.os == 'Windows'
        run: python -m pip install --no-deps -e .
      - name: Resolve Linux environment
        if: runner.os == 'Linux'
        run: python -m pip install -e ".[processing,field,fusion,visualization,geo,dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: node --test tests/viewer.test.cjs
      - run: python -m soil_sensing demo --output outputs/synthetic-ci
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-review-${{ matrix.os }}
          path: outputs/synthetic-ci/report
          retention-days: 7
