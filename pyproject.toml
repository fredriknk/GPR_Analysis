[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-sensing"
version = "0.3.0"
description = "Reproducible GPR and complementary soil-sensor analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
processing = ["numpy>=1.26", "scipy>=1.11", "xarray>=2025.6", "zarr>=3.1,<4", "matplotlib>=3.8", "pynmea2>=1.19"]
field = ["pyproj>=3.6"]
visualization = ["plotly>=7,<8", "shapely>=2,<3"]
geo = ["pyproj>=3.6", "geopandas>=0.14", "rasterio>=1.3", "pyarrow>=14"]
fusion = ["pandas>=2.1", "scikit-learn>=1.4"]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
soil-sensing = "soil_sensing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soil_sensing.visualization" = ["assets/*.js", "assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".spikes", "GPR_raw_data", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
