# Unfilled template: exact source/profile pairs and quantitative stores required.
# Coordinates approximate raw NMEA layout; null CRS/production plot; GIS/depth gated.
schema_version = "1.0"
synthetic = false
coordinate_mode = "raw_gps_relative"
vertical_axis = "recording_time"
position_policy = "accepted"
direction_policy = "separate"
# For crossing directions in one confirmed grid, use "combine_reviewed" and
# combination_evidence describing the joint diagnostic review (not calibration).
# scripts/build_real_volumes.py preserves complete collection grid memberships.
profiles = []
partitions = []
track_gap_m = 1.0
track_buffer_m = 0.5
evaluation_sample_step = 16
evaluation_attribute = "rms"

[attributes]
rms_samples = 5
rms_clipping_policy = "window"

[grid]
spacing_m = 0.25
bin_m = 0.25
max_distance_m = 1.0
max_edge_m = 1.5
max_cells = 2000000

[volume]
minimum_lines = 2
block_samples = 8
max_memory_mb = 512.0
max_stencil_patterns = 256
